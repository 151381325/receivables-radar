<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="回款雷达用户管理后台">
  <title>用户管理｜回款雷达</title>
  <link rel="stylesheet" href="../src/admin.css">
</head>
<body>
  <header class="admin-header">
    <a class="brand" href="../" aria-label="返回回款雷达工作台">
      <span class="brand-mark" aria-hidden="true">◎</span>
      <span><strong>回款雷达</strong><small>用户管理</small></span>
    </a>
    <div class="header-actions">
      <span id="admin-email"></span>
      <a class="text-link" href="../">返回工作台</a>
      <button class="text-button" id="admin-logout" type="button">退出</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="page-heading">
      <div><p class="eyebrow">管理员专用</p><h1>用户管理</h1><p>查看注册情况，必要时停用或恢复账号。</p></div>
      <button class="button secondary" id="admin-refresh" type="button">刷新数据</button>
    </section>

    <p class="notice" id="admin-notice" role="status" aria-live="polite"></p>
    <p class="error" id="admin-error" role="alert" aria-live="assertive" tabindex="-1"></p>

    <section class="summary-grid" id="admin-summary" aria-label="用户统计"></section>

    <section class="panel">
      <div class="panel-heading"><div><p class="eyebrow">账号列表</p><h2>注册用户</h2></div></div>
      <form class="filters" id="admin-search-form">
        <label class="search-field"><span>搜索邮箱</span><input id="admin-query" type="search" maxlength="254" autocomplete="off" placeholder="输入完整或部分邮箱"></label>
        <label><span>账号状态</span><select id="admin-status-filter">
          <option value="all">全部</option><option value="active">可登录</option>
          <option value="disabled">已停用</option><option value="verified">已验证</option>
          <option value="unverified">未验证</option>
        </select></label>
        <label><span>每页</span><select id="admin-page-size"><option value="20">20 条</option><option value="50">50 条</option></select></label>
        <button class="button primary" type="submit">查询</button>
      </form>

      <div class="user-table" role="table" aria-label="注册用户列表">
        <div class="user-row user-head" role="row">
          <span role="columnheader">账号</span><span role="columnheader">注册时间</span>
          <span role="columnheader">邮箱状态</span><span role="columnheader">应收笔数</span>
          <span role="columnheader">账号状态</span><span role="columnheader">操作</span>
        </div>
        <div id="admin-users"></div>
      </div>
      <div class="pagination" id="admin-pagination"></div>
    </section>
  </main>

  <dialog id="admin-status-dialog" class="status-dialog" aria-labelledby="status-dialog-title">
    <form method="dialog">
      <p class="eyebrow" id="status-dialog-eyebrow"></p>
      <h2 id="status-dialog-title">确认修改账号状态</h2>
      <p id="status-dialog-message"></p>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">取消</button>
        <button class="button danger" id="status-dialog-confirm" value="confirm">确认</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="../src/admin.js"></script>
</body>
</html>
